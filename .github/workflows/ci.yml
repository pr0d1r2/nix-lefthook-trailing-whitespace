---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pr0d1r2/nix-lefthook-ci-action@6aebe0cc2fef79dca75056048cf051300e138bda
        with:
          flake-check-timeout: '300'
          keep-home: 'true'

  build-macos:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pr0d1r2/nix-lefthook-ci-action@6aebe0cc2fef79dca75056048cf051300e138bda
        with:
          flake-check-timeout: '300'
          keep-home: 'true'
